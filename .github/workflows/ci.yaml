name: Demo quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: demo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DEMO_LANDING_DIR: ${{ github.workspace }}/.ci/landing
      DEMO_DUCKDB_NEXT: ${{ github.workspace }}/.ci/next/demo.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Check Python and generator contracts
        run: |
          python -m pyflakes data-generator/*.py airflow/*.py airflow/dags/*.py scripts/*.py tests/*.py
          python data-generator/test_tables.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Generate every source at a fixed anchor
        run: python tests/create_landing.py --output "$DEMO_LANDING_DIR"
      - run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: Build models, enforce contracts and run data tests
        run: |
          dbt/entrypoint.sh dbt build --project-dir dbt --profiles-dir dbt
          cp dbt/target/run_results.json dbt/target/build_results.json
      - name: Generate catalog
        run: dbt docs generate --project-dir dbt --profiles-dir dbt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/build_results.json
            dbt/target/catalog.json
            dbt/logs/dbt.log
          retention-days: 7

  dbt-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: northgraindata/dbt-doctor@be424bd145a6e58b1017b117ff18e9e575a9dcc3
        with:
          directory: dbt
          fail-on: error
          offline: "true"
          annotations: "true"
          setup-sqlfluff: "false"

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEMO_CUSTOMERS: "200"
      DEMO_ORDERS: "1000"
      DEMO_ACCOUNTS: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure isolated demo credentials
        run: python scripts/setup-env.py
      - name: Build backing services
        run: |
          docker compose build postgres minio data-generator airflow
          docker builder prune -f
      - name: Build DSUI, plugins and SDKs
        run: |
          docker compose build dsui
          docker builder prune -f
      - name: Start fresh stack and wait for actual health
        run: docker compose up -d --wait --wait-timeout 900
      - name: Exercise public API, scheduler, S3 and failed publication
        run: python scripts/smoke.py
      - name: Collect runtime logs
        if: always()
        run: docker compose logs --no-color > runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-log
          path: runtime.log
          retention-days: 7
      - name: Clean up test stack
        if: always()
        run: docker compose down -v
