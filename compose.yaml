# Public self-serve demo stack.
#
# Only DSUI is ever published. PostgreSQL, Airflow and MinIO stay on the compose
# network with no `ports`, so the anonymous internet can reach the product and
# nothing behind it. Memory and CPU limits are the primary defence against a
# visitor asking for something expensive.
#
# The instance is always-on and never scaled to zero: adapters are compiled on
# first start, which takes minutes.

name: dsui-demo

services:
  dsui:
    image: ghcr.io/northgraindata/dsui:${DSUI_IMAGE_TAG:-v0.1.1}
    restart: unless-stopped
    ports:
      - "${DSUI_PORT:-4192}:4192"
    environment:
      DSUI_CONFIG: /etc/dsui/dsui.yaml
      DSUI_MASTER_KEY: ${DSUI_MASTER_KEY:?set DSUI_MASTER_KEY in .env}
      DEMO_ADMIN_SECRET: ${DEMO_ADMIN_SECRET:?set DEMO_ADMIN_SECRET in .env}
      DSUI_HOST: 0.0.0.0
      DSUI_PORT: 4192
    volumes:
      - ./dsui.yaml:/etc/dsui/dsui.yaml:ro
      # Built from source on first start, like the adapters, so the plugin source
      # lives in the repository rather than in an image.
      - ./plugins:/plugins:ro
      # A named volume, not a bind mount: the image declares /data owned by its
      # non-root user, and the volume inherits that. A host bind mount would be
      # owned by the host user and the server could not write to it.
      - dsui-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/dsui", "doctor", "--check-adapters"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Adapters are compiled from source on first boot. Without a long grace
      # period the healthcheck fails during that build and the container
      # restart-loops before it ever gets a chance to finish.
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dsui} -d ${POSTGRES_DB:-analytics}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # Orchestrates extract, dbt and publish. Airflow's metadata lives in its own
  # database on the same server so a migration cannot touch demo data, and it is
  # never published: only DSUI is.
  airflow:
    build:
      context: ./airflow
    restart: unless-stopped
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-dsui-demo-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-dsui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-analytics}
    volumes:
      - ./airflow/dags:/airflow/dags
      - ./dbt:/dbt
      - demo-exports:/out
      - airflow-logs:/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "airflow", "version"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # The transformation layer. Runs as a one-shot job rather than a service:
  # DuckDB allows one writing process, so a long-lived dbt container would hold
  # the database open and block the visitor reading it. Airflow invokes this.
  dbt:
    build:
      context: ./dbt
    profiles: []
    environment:
      DBT_PROFILES_DIR: /dbt
      DEMO_LANDING_DIR: /out
      DEMO_DUCKDB_NEXT: /out/next/demo.duckdb
    volumes:
      - demo-exports:/out
      # Compiled SQL survives the container, so a Jinja or SQL error can be read
      # instead of guessed at.
      - dbt-target:/dbt/target
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # Seeds the synthetic dataset on first boot, then appends a trickle of recent
  # activity every five minutes so the demo's charts keep moving. The demo is
  # more convincing when something is visibly live.
  data-generator:
    build:
      context: ./data-generator
    restart: unless-stopped
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-dsui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-analytics}
      DEMO_CUSTOMERS: ${DEMO_CUSTOMERS:-5000}
      DEMO_ORDERS: ${DEMO_ORDERS:-60000}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-1200}
      DEMO_ROW_CAP: ${DEMO_ROW_CAP:-400000}
      DEMO_MAX_AGE_DAYS: ${DEMO_MAX_AGE_DAYS:-30}
      DEMO_TICK_SECONDS: ${DEMO_TICK_SECONDS:-300}
    volumes:
      - demo-exports:/out
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

volumes:
  dsui-data:
  postgres-data:
  demo-exports:
  dbt-target:
  airflow-logs:
