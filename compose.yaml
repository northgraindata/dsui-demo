name: dsui-demo
services:
  dsui:
    image: dsui-demo:0.1.1
    restart: unless-stopped
    ports:
    - 127.0.0.1:${DSUI_PORT:-4192}:4192
    environment:
      DSUI_CONFIG: /etc/dsui/dsui.yaml
      DSUI_MASTER_KEY: ${DSUI_MASTER_KEY:?set DSUI_MASTER_KEY in .env}
      DEMO_ADMIN_SECRET: ${DEMO_ADMIN_SECRET:?set DEMO_ADMIN_SECRET in .env}
      DSUI_HOST: 0.0.0.0
      DSUI_PORT: 4192
      DEMO_LANDING_DIR: /out/landing
      DEMO_DUCKDB_NEXT: /out/manual/demo.duckdb
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      DEMO_READER_USER: ${DEMO_READER_USER:-demo_reader}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-dsui-demo-reader}
      AIRFLOW_API_USER: ${AIRFLOW_API_USER:-dsui-demo}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dsui-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
    - ./dsui.yaml:/etc/dsui/dsui.yaml:ro
    - demo-exports:/out
    - dsui-data:/data
    depends_on:
      airflow:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/dsui
      - doctor
      - --check-adapters
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    build:
      context: .
      dockerfile: Dockerfile
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-dsui-demo-airflow}
      DEMO_WRITER_USER: ${DEMO_WRITER_USER:-demo_writer}
      DEMO_WRITER_PASSWORD: ${DEMO_WRITER_PASSWORD:-dsui-demo-writer}
      DEMO_READER_USER: ${DEMO_READER_USER:-demo_reader}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-dsui-demo-reader}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-analytics}
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: unless-stopped
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-dsui-demo-airflow}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'False'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'False'
      AIRFLOW__CORE__PARALLELISM: '4'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
      AIRFLOW_API_USER: ${AIRFLOW_API_USER:-dsui-demo}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:?set AIRFLOW_API_PASSWORD in .env}
      DATABASE_URL: postgresql://${DEMO_WRITER_USER:-demo_writer}:${DEMO_WRITER_PASSWORD:-dsui-demo-writer}@postgres:5432/${POSTGRES_DB:-analytics}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dsui-demo}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
    - demo-exports:/out
    - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      data-generator:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - /opt/demo/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3g
    image: dsui-demo-airflow:local
  minio:
    image: dsui-demo-minio:local
    restart: unless-stopped
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dsui-demo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/ready
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    build:
      context: .
      dockerfile: minio/Dockerfile
  dbt:
    build:
      context: .
      dockerfile: dbt/Dockerfile
    profiles:
    - tools
    environment:
      DBT_PROFILES_DIR: /dbt
      DEMO_LANDING_DIR: /out/landing
      DEMO_DUCKDB_NEXT: /out/manual/demo.duckdb
    volumes:
    - demo-exports:/out
    depends_on:
      airflow:
        condition: service_healthy
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    user: '50000:0'
    image: dsui-demo-dbt:local
  data-generator:
    build:
      context: ./data-generator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DEMO_WRITER_USER:-demo_writer}:${DEMO_WRITER_PASSWORD:-dsui-demo-writer}@postgres:5432/${POSTGRES_DB:-analytics}
      DEMO_CUSTOMERS: ${DEMO_CUSTOMERS:-5000}
      DEMO_ORDERS: ${DEMO_ORDERS:-60000}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-1200}
      DEMO_ROW_CAP: ${DEMO_ROW_CAP:-1000000}
      DEMO_MAX_AGE_DAYS: ${DEMO_MAX_AGE_DAYS:-30}
      DEMO_TICK_SECONDS: ${DEMO_TICK_SECONDS:-300}
    volumes:
    - demo-exports:/out
    depends_on:
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - from pathlib import Path; assert Path('/out/seed-ready.json').is_file()
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s
    image: dsui-demo-data-generator:local
  volume-init:
    image: busybox:1.37.0
    command:
    - sh
    - -ec
    - mkdir -p /out/next /out/landing /out/commerce; chown -R 50000:0 /out; chmod
      2775 /out /out/next /out/landing /out/commerce
    volumes:
    - demo-exports:/out
    restart: 'no'
volumes:
  dsui-data: null
  postgres-data: null
  demo-exports: null
  airflow-logs: null
  minio-data: null
