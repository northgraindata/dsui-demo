version: 2
sources:
- name: landing
  schema: landing
  description: Synthetic public dataset; raw columns retain their export representation.
  tables:
  - name: events
    description: Raw events; one text-typed Parquet landing file.
    columns:
    - name: event_id
      data_type: varchar
      description: Raw export value as text. Unique event identifier generated by the originating application.
    - name: customer_id
      data_type: varchar
      description: Raw export value as text. Customer identifier within this source; Stripe IDs use the cus_ prefix.
    - name: name
      data_type: varchar
      description: Raw export value as text. Name reported by the source.
    - name: occurred_at
      data_type: varchar
      description: Raw export value as text. UTC timestamp when the event or session occurred.
    - name: properties
      data_type: varchar
      description: Raw export value as text. Event/person properties JSON, retaining vendor-specific property names.
  loader: demo_generator_and_airflow_parquet_extract
  meta:
    owner: data-platform
    synthetic: true
