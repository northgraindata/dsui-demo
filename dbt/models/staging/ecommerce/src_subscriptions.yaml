version: 2
sources:
- name: landing
  schema: landing
  description: Synthetic public dataset; raw columns retain their export representation.
  tables:
  - name: subscriptions
    description: Raw subscriptions; one text-typed Parquet landing file.
    columns:
    - name: subscription_id
      data_type: varchar
      description: Raw export value as text. Subscription identifier; one current object snapshot per subscription.
    - name: customer_id
      data_type: varchar
      description: Raw export value as text. Customer identifier within this source; Stripe IDs use the cus_ prefix.
    - name: plan
      data_type: varchar
      description: Raw export value as text. Plan reported by the source.
    - name: status
      data_type: varchar
      description: Raw export value as text. Normalized source status, specific to the object type.
    - name: seats
      data_type: varchar
      description: Raw export value as text. Seats reported by the source.
    - name: mrr
      data_type: varchar
      description: Raw export value as text. Current product monthly recurring revenue in EUR; zero for churned
        accounts.
    - name: started_at
      data_type: varchar
      description: Raw export value as text. Started at timestamp in UTC; null if not applicable.
    - name: ended_at
      data_type: varchar
      description: Raw export value as text. Ended at timestamp in UTC; null if not applicable.
  loader: demo_generator_and_airflow_parquet_extract
  meta:
    owner: data-platform
    synthetic: true
