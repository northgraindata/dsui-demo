version: 2
models:
- name: stg_ecommerce__events
  description: Typed events; one row per event_id.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
    tags:
    - staging
    - ecommerce
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      min_value: 1
  columns:
  - name: event_id
    description: Unique event identifier generated by the originating application.
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Customer identifier within this source; Stripe IDs use the cus_ prefix.
    data_type: varchar
  - name: name
    description: Name reported by the source.
    data_type: varchar
  - name: occurred_at
    description: UTC timestamp when the event or session occurred.
    data_type: timestamp
    data_tests:
    - not_null
  - name: properties
    description: Event/person properties JSON, retaining vendor-specific property names.
    data_type: json
