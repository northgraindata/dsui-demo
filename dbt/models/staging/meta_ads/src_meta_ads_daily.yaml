version: 2
sources:
- name: landing
  schema: landing
  description: Synthetic public dataset; raw columns retain their export representation.
  tables:
  - name: meta_ads_daily
    description: Raw meta ads daily; one text-typed Parquet landing file.
    columns:
    - name: date
      data_type: varchar
      description: Raw export value as text. Date reported by the source.
    - name: campaign_id
      data_type: varchar
      description: Raw export value as text. Campaign id within the originating source.
    - name: campaign_name
      data_type: varchar
      description: Raw export value as text. Human-readable campaign name, null when the export has (not set).
    - name: adset_id
      data_type: varchar
      description: Raw export value as text. Adset id within the originating source.
    - name: adset_name
      data_type: varchar
      description: Raw export value as text. Adset name reported by the source.
    - name: impressions
      data_type: varchar
      description: Raw export value as text. Impressions count for this report dimension row.
    - name: reach
      data_type: varchar
      description: Raw export value as text. Reach count for this report dimension row.
    - name: clicks
      data_type: varchar
      description: Raw export value as text. Clicks count for this report dimension row.
    - name: spend
      data_type: varchar
      description: Raw export value as text. Advertising spend in EUR major currency units; counted once per report
        row.
    - name: cpc
      data_type: varchar
      description: Raw export value as text. Advertising cost in EUR per click.
    - name: cpm
      data_type: varchar
      description: Raw export value as text. Advertising cost in EUR per thousand impressions.
    - name: ctr
      data_type: varchar
      description: Raw export value as text. Click-through rate as a fraction between zero and one in this normalized
        demo export.
    - name: currency
      data_type: varchar
      description: Raw export value as text. Currency code. Stripe uses lowercase; acquisition and product reports
        use uppercase EUR. No FX conversion is modeled.
    - name: actions
      data_type: varchar
      description: Raw export value as text. Original Meta action-type/value JSON array, preserved without expanding
        the report grain.
  loader: demo_generator_and_airflow_parquet_extract
  meta:
    owner: data-platform
    synthetic: true
