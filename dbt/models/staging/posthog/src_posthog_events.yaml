version: 2
sources:
- name: landing
  schema: landing
  description: Synthetic public dataset; raw columns retain their export representation.
  tables:
  - name: posthog_events
    description: Raw posthog events; one text-typed Parquet landing file.
    columns:
    - name: event_id
      data_type: varchar
      description: Raw export value as text. Unique event identifier generated by the originating application.
    - name: event
      data_type: varchar
      description: Raw export value as text. Event reported by the source.
    - name: distinct_id
      data_type: varchar
      description: Raw export value as text. PostHog person identifier; events retain the original identity.
    - name: occurred_at
      data_type: varchar
      description: Raw export value as text. UTC timestamp when the event or session occurred.
    - name: current_url
      data_type: varchar
      description: Raw export value as text. Current url reported by the source.
    - name: referrer
      data_type: varchar
      description: Raw export value as text. Referrer reported by the source.
    - name: browser
      data_type: varchar
      description: Raw export value as text. Browser reported by the source.
    - name: os
      data_type: varchar
      description: Raw export value as text. Os reported by the source.
    - name: properties
      data_type: varchar
      description: Raw export value as text. Event/person properties JSON, retaining vendor-specific property names.
  loader: demo_generator_and_airflow_parquet_extract
  meta:
    owner: data-platform
    synthetic: true
