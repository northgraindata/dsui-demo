version: 2
models:
- name: stg_posthog__events
  description: PostHog event envelope, one row per event_id; optional properties remain nullable.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
    tags:
    - staging
    - posthog
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      min_value: 1
  columns:
  - name: event_id
    description: Unique event identifier generated by the originating application.
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: event
    description: Event reported by the source.
    data_type: varchar
  - name: distinct_id
    description: PostHog person identifier; events retain the original identity.
    data_type: varchar
    data_tests:
    - relationships:
        to: '{{ ref(''stg_posthog__people'') }}'
        field: distinct_id
  - name: occurred_at
    description: UTC timestamp when the event or session occurred.
    data_type: timestamp
    data_tests:
    - not_null
  - name: current_url
    description: Current url reported by the source.
    data_type: varchar
  - name: referrer
    description: Referrer reported by the source.
    data_type: varchar
  - name: browser
    description: Browser reported by the source.
    data_type: varchar
  - name: os
    description: Os reported by the source.
    data_type: varchar
  - name: properties
    description: Event/person properties JSON, retaining vendor-specific property names.
    data_type: json
  - name: feature_flag
    description: Flag key on $feature_flag_called events; null on other event types.
    data_type: varchar
  - name: feature_flag_variant
    description: Variant reported on a flag call; synthetic exposure, not a randomized experiment assignment.
    data_type: varchar
  - name: account_id
    description: Product account identifier used to join billing and product analytics.
    data_type: varchar
    data_tests:
    - relationships:
        to: '{{ ref(''stg_product__accounts'') }}'
        field: account_id
  - name: rows_synced
    description: Rows processed in a source sync event; null for unrelated events.
    data_type: bigint
  - name: duration_ms
    description: Operation duration in milliseconds; null when not provided by the event.
    data_type: bigint
  - name: rows_returned
    description: Rows returned by a query event; null for unrelated events.
    data_type: bigint
  - name: account_plan_at_event
    description: Plan recorded in $set on the event, which can differ from current account plan.
    data_type: varchar
