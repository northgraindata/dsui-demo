# The landing zone, exactly as the generator wrote it.
#
# Every table is text all the way down, because that is what arrived. The
# staging views own the casting, which keeps each source honest: a visitor
# comparing `landing` to `staging` can see precisely what the pipeline changed.

version: 2

sources:
  - name: landing
    schema: landing
    description: >
      One Parquet file per raw table, written by the data generator and refreshed
      by the Airflow extract step. All columns are text by design.
    tables:
      - name: accounts
        description: The product's own account dimension, and the join key for every other source.
      - name: customers
        description: E-commerce customers, with duplicates and missing emails.
      - name: products
      - name: subscriptions
      - name: orders
      - name: order_items
      - name: payments
      - name: refunds
      - name: events
      - name: stripe_customers
      - name: stripe_subscriptions
      - name: stripe_invoices
      - name: stripe_charges
        description: Verbatim Stripe charge payloads. Amounts are integer minor units.
      - name: stripe_refunds
      - name: stripe_balance_transactions
        description: Charges are negative, refunds positive, and net = amount - fee.
      - name: posthog_people
      - name: posthog_events
      - name: ga4_sessions
      - name: meta_ads_daily
      - name: google_ads_daily
      - name: gsc_daily
