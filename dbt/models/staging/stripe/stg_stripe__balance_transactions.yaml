version: 2
models:
- name: stg_stripe__balance_transactions
  description: Merchant balance ledger, one row per txn_id. Charges positive, refunds negative, net = amount - fee.
  config:
    contract:
      enforced: true
    meta:
      owner: data-platform
    tags:
    - staging
    - stripe
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      min_value: 1
  - dbt_utils.expression_is_true:
      expression: net_minor = amount_minor - fee_minor
  - dbt_utils.expression_is_true:
      expression: (txn_type = 'charge' and amount_minor > 0) or (txn_type = 'refund' and amount_minor < 0)
  columns:
  - name: txn_id
    description: Stripe balance transaction identifier, unique across charges and refunds.
    data_type: varchar
    data_tests:
    - not_null
    - unique
  - name: charge_id
    description: Stripe charge identifier, including succeeded and failed attempts.
    data_type: varchar
    data_tests:
    - relationships:
        to: '{{ ref(''stg_stripe__charges'') }}'
        field: charge_id
  - name: source_id
    description: 'Stripe source object ID: ch_ for a charge and re_ for a refund.'
    data_type: varchar
  - name: txn_type
    description: 'Stripe balance movement type: charge or refund in this modeled subset.'
    data_type: varchar
    data_tests:
    - accepted_values:
        values:
        - charge
        - refund
  - name: created_at
    description: Object creation timestamp in UTC, parsed from the source representation.
    data_type: timestamp
    data_tests:
    - not_null
  - name: available_on
    description: UTC time when the net funds become available in the Stripe balance.
    data_type: timestamp
  - name: amount_minor
    description: Amount in integer minor currency units. Balance movements are signed; charges/refund objects are
      positive.
    data_type: integer
  - name: fee_minor
    description: Processing fee in minor currency units, positive when assessed.
    data_type: integer
    data_tests:
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
  - name: net_minor
    description: Signed balance impact in minor units, equal to gross less refunds and processing fees.
    data_type: integer
  - name: currency
    description: Currency code. Stripe uses lowercase; acquisition and product reports use uppercase EUR. No FX
      conversion is modeled.
    data_type: varchar
  - name: availability
    description: 'Stripe balance availability: available or pending. Cash marts include only available rows.'
    data_type: varchar
    data_tests:
    - accepted_values:
        values:
        - available
        - pending
  - name: reporting_category
    description: Reporting category reported by the source.
    data_type: varchar
  - name: payload
    description: Synthetic API object snapshot JSON, pinned to the modeled Stripe 2024-06-20 schema; not a webhook
      envelope.
    data_type: json
