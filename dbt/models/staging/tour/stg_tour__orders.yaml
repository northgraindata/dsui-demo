version: 2
models:
  - name: stg_tour__orders
    description: Unfiltered tour orders preserving the source checkout status.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: varchar
        description: Stable synthetic order identifier.
        tests: [unique, not_null]
      - name: ordered_on
        data_type: date
        description: Synthetic order date.
        tests: [not_null]
      - name: status
        data_type: varchar
        description: Original checkout status including paid and completed.
        tests: [not_null]
      - name: amount
        data_type: integer
        description: Synthetic revenue in whole currency units.
        tests: [not_null]
