adapters:
  postgresql:
    source: local
    path: /app/source/packages/adapter-postgresql
  duckdb:
    source: local
    path: /app/source/packages/adapter-duckdb
  s3:
    source: local
    path: /app/source/packages/adapter-s3
  airflow:
    source: local
    path: /app/source/packages/adapter-airflow
  dbt:
    source: local
    path: /app/source/packages/adapter-dbt
plugins:
  demo-auth:
    critical: true
    config:
      adminSecret: ${DEMO_ADMIN_SECRET}
      allowExecution: true
    package: /app/plugins/demo-auth.mjs
  code-repository:
    package: '@northgraindata/dsui-plugin-code-repository'
    browserBundle: '@northgraindata/dsui-plugin-code-repository/browser'
    config:
      refreshMinutes: 0
      connections:
      - key: demo-dags
        serviceId: orchestration
        name: Demo pipelines
        provider: github
        repository: northgraindata/dsui-demo
        branch: main
        folder: airflow/dags
        instructions: The DAGs Airflow runs in this demo. `demo_pipeline` builds the
          platform's own warehouse; `daily_ecommerce_load` stands in for a customer's
          pipeline.
  demo-guide:
    config:
      title: Explore the DSUI demo
      disclaimer: Every service, row and number here is synthetic. Nothing you do
        reaches a real system, and the data resets on a schedule.
    package: /app/plugins/demo-guide.mjs
  health:
    # Built from the pinned DSUI GitHub revision in Dockerfile.
    package: /app/plugins/health.mjs
    browserBundle: /app/plugins/health.browser.mjs
    enabled: true
    config:
      timeoutMs: 5000
services:
- id: snapshot
  adapter: duckdb
  name: Analytics warehouse
  connection:
    method: file
    path: /out/demo.duckdb
    readOnly: true
- id: analytics
  adapter: postgresql
  name: PostgreSQL source
  connection:
    host: postgres
    port: 5432
    database: ${POSTGRES_DB}
    databaseScope: selected
    username: ${DEMO_READER_USER}
    password: ${DEMO_READER_PASSWORD}
    sslMode: disable
    connectTimeout: 10
    statementTimeout: 30000
    applicationName: dsui-demo
- id: transformations
  adapter: dbt
  name: dbt project
  connection:
    method: local
    projectPath: /opt/demo-dbt
    profilesDir: /opt/demo-dbt
    targetPath: target
    executable: /opt/dbt/bin/dbt
- id: orchestration
  adapter: airflow
  name: Orchestration
  connection:
    method: airflow-2
    baseUrl: http://airflow:8080
    username: ${AIRFLOW_API_USER}
    password: ${AIRFLOW_API_PASSWORD}
- id: landing
  adapter: s3
  name: Object storage
  connection:
    region: eu-central-1
    endpoint: http://minio:9000
    accessKeyId: ${MINIO_ROOT_USER}
    secretAccessKey: ${MINIO_ROOT_PASSWORD}
    forcePathStyle: true
